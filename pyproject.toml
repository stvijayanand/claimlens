[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimlens"
version = "0.1.0"
description = "Check a body-shop repair estimate against photos of the damage."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "fastapi>=0.110",
    "httpx>=0.27",
    "openai>=1.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pytest>=8.0",
    "python-dotenv>=1.0",
    "streamlit>=1.33",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
